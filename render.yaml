# Render blueprint — UASK backend staging (see backend/DEPLOYMENT.md).
#
# Deploy: Render dashboard → New → Blueprint → connect this repository →
# Render parses this file → review → fill prompted (sync: false) values →
# Apply. Full manual step-by-step (New → Web Service) is in DEPLOYMENT.md.
#
# Database: external Supabase Postgres (free tier) — paste its session
# pooler URL when prompted for DATABASE_URL. Render's own Postgres is a
# paid instance (Starter ≈ $7/mo) if you prefer it instead.

services:
  - type: web
    name: uask-backend-staging
    runtime: python
    rootDir: backend # monorepo: frontend lives at the repo root
    plan: free # sleeps after inactivity; upgrade for always-on
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh # alembic upgrade head, then uvicorn — no --reload
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: ENV
        value: production # production cookie/security behavior stays on
      - key: JWT_SECRET
        generateValue: true # Render-generated, never committed
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: ENABLE_DOCS
        value: "true" # staging Swagger (/docs, /openapi.json); prod sets false
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false # Supabase Postgres session-pooler URL (postgresql://…:5432/postgres)
      - key: CORS_ORIGINS
        value: http://localhost:5173 # local Vite dev origin
      - key: FRONTEND_URL
        value: https://reversemarketplace-eight.vercel.app # deployed frontend (merged into CORS with localhost)
      - key: COOKIE_SECURE
        value: "true"
      - key: BEHIND_PROXY
        value: "true" # trust Render's proxy headers (X-Forwarded-For, --proxy-headers)
      - key: WEB_CONCURRENCY
        value: "1" # one worker on the 512MB free instance
      - key: STORAGE_PROVIDER
        value: supabase # never local: Render's disk is ephemeral
      - key: SUPABASE_URL
        sync: false # <SUPABASE_URL> — https://PROJECT.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # <SUPABASE_SERVICE_ROLE_KEY> — dashboard only, never chat/git
      - key: SUPABASE_STORAGE_BUCKET
        sync: false # <BUCKET_NAME> — e.g. uask-uploads (public bucket)
      - key: RATE_LIMIT_ENABLED
        value: "true"
